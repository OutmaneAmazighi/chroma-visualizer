<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0f">
  <title>CHROMA — Live Audio Visualizer</title>

  <style>
    :root {
      color-scheme: dark;
      --bg: #0a0a0f;
      --text: #eef2ff;
      --muted: #969bab;
      --accent: #59f5ff;
      --border: rgba(255, 255, 255, .11);
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif;
    }

    button, select, input { font: inherit; }
    button, select { -webkit-tap-highlight-color: transparent; }
    button { cursor: pointer; }
    button:disabled { cursor: wait; opacity: .55; }
    [hidden] { display: none !important; }

    button:focus-visible, select:focus-visible, input:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 4px;
    }

    #visualizer {
      display: block;
      width: 100%;
      height: 100%;
    }

    .masthead {
      position: fixed;
      z-index: 2;
      top: max(26px, env(safe-area-inset-top));
      left: max(28px, env(safe-area-inset-left));
      pointer-events: none;
      user-select: none;
    }

    .brand {
      font-size: 14px;
      font-weight: 800;
      letter-spacing: .34em;
    }

    .brand span { color: var(--accent); }

    .eyebrow {
      margin-top: 8px;
      color: var(--muted);
      font-size: 9px;
      letter-spacing: .22em;
      text-transform: uppercase;
    }

    .status {
      position: fixed;
      z-index: 2;
      top: max(28px, env(safe-area-inset-top));
      right: max(28px, env(safe-area-inset-right));
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 10px;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #6d7281;
    }

    .status.live .status-dot {
      background: var(--accent);
      box-shadow: 0 0 12px var(--accent);
    }

    .start-card {
      position: fixed;
      z-index: 3;
      top: 44%;
      left: 50%;
      width: min(390px, calc(100vw - 36px));
      padding: 32px;
      transform: translate(-50%, -50%);
      border: 1px solid var(--border);
      border-radius: 24px;
      background: rgba(12, 14, 23, .84);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      box-shadow: 0 24px 100px #0008;
      text-align: center;
    }

    .start-card .kicker {
      color: var(--accent);
      font-size: 10px;
      letter-spacing: .2em;
      text-transform: uppercase;
    }

    h1 {
      margin: 16px 0 12px;
      font-size: clamp(28px, 5vw, 38px);
      line-height: 1.08;
      letter-spacing: -.05em;
    }

    .start-card p {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.7;
    }

    .primary {
      width: 100%;
      margin-top: 12px;
      padding: 13px 20px;
      border: 0;
      border-radius: 12px;
      background: var(--accent);
      color: #071116;
      font-size: 12px;
      font-weight: 800;
    }

    .privacy {
      display: block;
      margin-top: 16px;
      color: #888e9f;
      font-size: 10px;
      line-height: 1.6;
    }

    #error {
      margin: 14px 0 0;
      color: #ff9fab;
      font-size: 12px;
    }

    .hud {
      position: fixed;
      z-index: 4;
      bottom: max(24px, env(safe-area-inset-bottom));
      left: 50%;
      display: flex;
      align-items: center;
      gap: 22px;
      max-width: calc(100vw - 28px);
      padding: 16px 18px;
      transform: translateX(-50%);
      border: 1px solid var(--border);
      border-radius: 20px;
      background: rgba(19, 21, 32, .72);
      backdrop-filter: blur(24px) saturate(130%);
      -webkit-backdrop-filter: blur(24px) saturate(130%);
      box-shadow: 0 16px 60px #0007;
      transition: opacity .6s ease, border-color .3s ease;
    }

    body.idle .hud { opacity: .22; }

    body.idle .hud:hover,
    body.idle .hud:focus-within { opacity: 1; }

    .control-group { display: grid; gap: 8px; }

    .control-label {
      display: flex;
      justify-content: space-between;
      color: var(--muted);
      font-size: 9px;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    .modes {
      display: flex;
      gap: 3px;
      padding: 3px;
      border: 1px solid rgba(255, 255, 255, .05);
      border-radius: 10px;
      background: #0003;
    }

    .mode, .utility {
      min-height: 33px;
      padding: 7px 13px;
      border: 1px solid transparent;
      border-radius: 7px;
      background: transparent;
      color: #989eaf;
      font-size: 11px;
      white-space: nowrap;
      transition: color .2s, background .2s;
    }

    .mode:hover, .utility:hover {
      background: #ffffff0d;
      color: white;
    }

    .mode[aria-pressed="true"] {
      border-color: #ffffff12;
      background: #ffffff12;
      color: var(--accent);
    }

    select {
      width: 148px;
      min-height: 39px;
      padding: 0 10px;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: #151722;
      color: var(--text);
      font-size: 11px;
    }

    .gain-group { width: 125px; }

    input[type="range"] {
      width: 100%;
      height: 39px;
      margin: 0;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .utilities {
      display: flex;
      gap: 6px;
      align-self: end;
      padding-bottom: 3px;
    }

    .utility {
      border-color: var(--border);
      color: #d0d5e3;
    }

    #notice {
      position: fixed;
      z-index: 5;
      bottom: 150px;
      left: 50%;
      max-width: calc(100vw - 40px);
      padding: 10px 16px;
      transform: translateX(-50%);
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #171924;
      color: #d3d8e5;
      font-size: 12px;
      text-align: center;
    }

    @media (max-width: 760px) {
      .hud {
        width: min(460px, calc(100vw - 24px));
        flex-wrap: wrap;
        justify-content: space-between;
        gap: 12px 16px;
        padding: 14px;
      }

      .modes .mode { padding-inline: 12px; }
      select { width: 142px; }
      .gain-group { flex: 1; max-width: 205px; }
      .utilities { align-self: center; padding: 0; }
      .masthead { left: 20px; top: 20px; }
      .status { right: 20px; top: 22px; font-size: 8px; }
      .eyebrow { font-size: 8px; }
      .start-card { top: 40%; padding: 25px; }
      #notice { bottom: 195px; }
    }

    @media (max-height: 520px) {
      .start-card { top: 39%; padding: 16px 24px; }
      .start-card h1 { margin: 8px 0; font-size: 26px; }
      .start-card p { margin: 6px 0; }
      .privacy { margin-top: 8px; }
      .hud { bottom: 10px; padding: 10px 14px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .hud, .mode, .utility { transition: none; }
    }
  </style>
</head>

<body>
  <canvas id="visualizer" aria-label="Live microphone audio visualizer">
    Your browser does not support the Canvas API.
  </canvas>

  <header class="masthead">
    <div class="brand">CHROMA<span> /</span></div>
    <div class="eyebrow">Sound into light</div>
  </header>

  <div id="status" class="status" role="status">
    <span class="status-dot" aria-hidden="true"></span>
    <span id="statusText">Preview · mic off</span>
  </div>

  <main id="startCard" class="start-card">
    <div class="kicker">Realtime audio reactive</div>
    <h1>Give your sound<br>a spectrum.</h1>
    <p>Turn on your microphone and watch the room come alive in color.</p>
    <button id="startButton" class="primary" type="button">Start Mic →</button>
    <small class="privacy">
      Audio stays on your device.<br>
      No recording. No uploads. No speaker feedback.
    </small>
    <p id="error" role="alert" hidden></p>
  </main>

  <section class="hud" aria-label="Visualizer controls">
    <div class="control-group">
      <span id="modeLabel" class="control-label">Visual mode</span>
      <div class="modes" role="group" aria-labelledby="modeLabel">
        <button type="button" class="mode"
                data-mode="bars" aria-pressed="true">Bars</button>
        <button type="button" class="mode"
                data-mode="radial" aria-pressed="false">Radial</button>
        <button type="button" class="mode"
                data-mode="wave" aria-pressed="false">Wave</button>
      </div>
    </div>

    <div class="control-group">
      <label class="control-label" for="palette">RGB palette</label>
      <select id="palette">
        <option value="cyberpunk">Cyberpunk</option>
        <option value="rainbow">Rainbow Wave</option>
        <option value="solar">Solar Flare</option>
        <option value="toxic">Toxic Matrix</option>
      </select>
    </div>

    <div class="control-group gain-group">
      <label class="control-label" for="gain">
        Sensitivity <output id="gainValue" for="gain">1.4×</output>
      </label>
      <input id="gain" type="range"
             min="0.2" max="4" step="0.1" value="1.4">
    </div>

    <div class="utilities">
      <button id="micButton" class="utility"
              type="button" hidden>Stop mic</button>
      <button id="fullscreenButton" class="utility" type="button"
              aria-label="Enter fullscreen"
              aria-pressed="false">⛶ Full</button>
    </div>
  </section>

  <div id="notice" role="status" hidden></div>

  <script>
    "use strict";

    // ============================================================
    // DOM / visual configuration
    // ============================================================
    const $ = selector => document.querySelector(selector);

    const canvas = $("#visualizer");
    const ctx = canvas.getContext("2d", { alpha: false });

    const startCard = $("#startCard");
    const startButton = $("#startButton");
    const micButton = $("#micButton");
    const errorElement = $("#error");
    const statusElement = $("#status");
    const statusText = $("#statusText");
    const fullscreenButton = $("#fullscreenButton");
    const hud = $(".hud");
    const modeButtons = [...document.querySelectorAll("[data-mode]")];

    const BG = "#0a0a0f";
    const TAU = Math.PI * 2;
    const BAND_COUNT = 72;
    const COLOR_COUNT = 24;
    const WAVE_POINT_COUNT = 512;
    const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)");

    let width = 1;
    let height = 1;
    let dpr = 1;
    let mode = "bars";
    let palette = "cyberpunk";
    let sensitivity = 1.4;
    let bass = 0;
    let waveAutoGain = 1;
    let previousTime = 0;
    let clearNextFrame = true;
    let lastColorUpdate = -Infinity;

    const bands = new Float32Array(BAND_COUNT);
    const peaks = new Float32Array(BAND_COUNT);
    const peakHold = new Float32Array(BAND_COUNT);
    const bandStart = new Uint16Array(BAND_COUNT);
    const bandEnd = new Uint16Array(BAND_COUNT);
    const wavePoints = new Float32Array(WAVE_POINT_COUNT);
    const colors = new Array(COLOR_COUNT);

    // Precomputed drawing batches avoid scanning all bars for every color.
    const colorGroups = Array.from({ length: COLOR_COUNT }, () => []);
    const bandColors = new Uint8Array(BAND_COUNT);

    for (let i = 0; i < BAND_COUNT; i++) {
      const c = Math.min(
        COLOR_COUNT - 1,
        Math.floor(i / BAND_COUNT * COLOR_COUNT)
      );
      bandColors[i] = c;
      colorGroups[c].push(i);
    }

    const dust = Array.from({ length: 48 }, () => ({
      x: Math.random(),
      y: Math.random(),
      radius: Math.random() * 1.2 + .3,
      speed: Math.random() * .012 + .003,
      phase: Math.random() * TAU
    }));

    // Cached gradients are rebuilt only when their dependencies change.
    let waveGradient = null;
    let coreGradient = null;

    function invalidateGradients() {
      waveGradient = null;
      coreGradient = null;
    }

    function resize() {
      width = Math.max(1, window.innerWidth);
      height = Math.max(1, window.innerHeight);
      dpr = window.devicePixelRatio || 1;

      canvas.width = Math.round(width * dpr);
      canvas.height = Math.round(height * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      invalidateGradients();
      clearNextFrame = true;
    }

    function resetSignal() {
      bands.fill(0);
      peaks.fill(0);
      peakHold.fill(0);
      wavePoints.fill(0);
      waveAutoGain = 1;
      bass = 0;
      clearNextFrame = true;
    }

    function updateColors(time) {
      if (time - lastColorUpdate < 1 / 12) return;
      lastColorUpdate = time;

      const cycle = reducedMotion.matches ? 0 : time;

      for (let i = 0; i < COLOR_COUNT; i++) {
        const p = i / (COLOR_COUNT - 1);
        let hue;
        let lightness = 62;

        switch (palette) {
          case "rainbow":
            hue = (p * 320 + cycle * 30) % 360;
            break;
          case "solar":
            hue = 8 + p * 43;
            lightness = 57 + p * 9;
            break;
          case "toxic":
            hue = 105 + p * 48;
            lightness = 49 + p * 16;
            break;
          default:
            hue = 183 + p * 130 + Math.sin(cycle * .3) * 8;
        }

        colors[i] = `hsl(${hue.toFixed(1)}, 100%, ${lightness}%)`;
      }

      invalidateGradients();
    }

    // ============================================================
    // Audio lifecycle
    //
    // Each start owns a separate session. A cancelled permission
    // request cannot attach its stream to a newer audio context.
    //
    // Graph: microphone -> analyser
    // No speaker output, monitor, or feedback connection.
    // ============================================================
    let session = null;

    function isCurrent(s) {
      return session === s && !s.disposed;
    }

    function disposeSession(s) {
      if (!s || s.disposed) return;
      s.disposed = true;

      for (const cleanup of s.cleanups) cleanup();
      s.cleanups.length = 0;

      try { s.source?.disconnect(); } catch {}
      try { s.analyser?.disconnect(); } catch {}

      s.stream?.getTracks().forEach(track => track.stop());

      if (s.context && s.context.state !== "closed") {
        s.context.close().catch(() => {});
      }
    }

    function listen(s, target, event, handler) {
      target.addEventListener(event, handler);
      s.cleanups.push(() => target.removeEventListener(event, handler));
    }

    function updateAudioUI() {
      const s = session;
      const ready = !!s?.ready;
      const running = ready && s.context.state === "running";
      const muted = ready && (s.track.muted || !s.track.enabled);

      startButton.disabled = !!s && !ready;
      startButton.textContent = s && !ready ? "Connecting…" : "Start Mic →";
      startCard.hidden = ready;
      micButton.hidden = !s;
      statusElement.classList.toggle("live", running && !muted);

      if (!s) {
        statusText.textContent = "Preview · mic off";
        statusElement.title = "";
      } else if (!ready) {
        statusText.textContent = "Connecting · microphone";
        micButton.textContent = "Cancel";
      } else if (!running) {
        statusText.textContent = "Audio paused";
        micButton.textContent = "Resume";
      } else if (muted) {
        statusText.textContent = "Mic temporarily muted";
        micButton.textContent = "Stop mic";
      } else {
        statusText.textContent = "Live · microphone";
        micButton.textContent = "Stop mic";
      }
    }

    function friendlyAudioError(error) {
      switch (error?.name) {
        case "NotAllowedError":
        case "SecurityError":
          return "Microphone access was blocked. Allow it in your browser’s site settings. Embedded pages also need microphone permission from their host.";
        case "NotFoundError":
        case "DevicesNotFoundError":
          return "No microphone was found. Connect or enable an input device, then try again.";
        case "NotReadableError":
        case "TrackStartError":
          return "The microphone could not be opened. Check your operating system’s microphone permissions and whether another application is using it.";
        case "OverconstrainedError":
          return "The microphone cannot provide a supported audio input.";
        case "AbortError":
          return "Microphone startup was interrupted. Please try again.";
        default:
          return error?.message || "Could not start the microphone. Please try again.";
      }
    }

    async function requestMicrophone() {
      // Raw capture is preferable for music and environmental sound.
      // Unsupported preferences may be ignored by the browser.
      try {
        return await navigator.mediaDevices.getUserMedia({
          audio: {
            echoCancellation: false,
            noiseSuppression: false,
            autoGainControl: false,
            channelCount: 1
          }
        });
      } catch (error) {
        // Retry only a constraints failure, not a permission denial.
        if (error.name !== "OverconstrainedError") throw error;
        return await navigator.mediaDevices.getUserMedia({ audio: true });
      }
    }

    function configureFrequencyBands(s) {
      const count = s.analyser.frequencyBinCount;
      const binHz = s.context.sampleRate / s.analyser.fftSize;
      const lowFrequency = 28;
      const highFrequency = Math.min(17000, s.context.sampleRate / 2);

      for (let i = 0; i < BAND_COUNT; i++) {
        const low = lowFrequency * Math.pow(
          highFrequency / lowFrequency, i / BAND_COUNT
        );
        const high = lowFrequency * Math.pow(
          highFrequency / lowFrequency, (i + 1) / BAND_COUNT
        );

        const first = Math.max(
          1, Math.min(count - 1, Math.round(low / binHz))
        );

        bandStart[i] = first;
        bandEnd[i] = Math.min(
          count, Math.max(first + 1, Math.round(high / binHz))
        );
      }

      s.bassStart = Math.max(1, Math.floor(35 / binHz));
      s.bassEnd = Math.min(count - 1, Math.ceil(180 / binHz));
    }

    async function startMic() {
      if (session) return;

      errorElement.hidden = true;

      const s = {
        context: null,
        stream: null,
        source: null,
        analyser: null,
        track: null,
        frequencyData: null,
        timeData: null,
        cleanups: [],
        ready: false,
        disposed: false,
        silenceTime: 0,
        silenceNotified: false,
        lastTelemetry: 0,
        inputRms: 0,
        inputPeak: 0
      };

      session = s;
      updateAudioUI();
      wakeHUD();

      try {
        if (!window.isSecureContext) {
          throw new Error(
            "Microphone access requires HTTPS or localhost. Open this page through a local web server or a secure website."
          );
        }

        if (!navigator.mediaDevices?.getUserMedia) {
          throw new Error(
            "Microphone capture is unavailable in this browser or page."
          );
        }

        const AudioContextClass =
          window.AudioContext || window.webkitAudioContext;

        if (!AudioContextClass) {
          throw new Error("This browser does not support Web Audio.");
        }

        // Both construction and resume originate in the button gesture.
        s.context = new AudioContextClass({ latencyHint: "interactive" });
        await s.context.resume();

        if (!isCurrent(s)) return;

        // IMPORTANT: await the actual MediaStream and keep it local.
        // Never pass a Promise, session object, or track to this API.
        const capturedStream = await requestMicrophone();

        if (!isCurrent(s)) {
          capturedStream.getTracks().forEach(track => track.stop());
          return;
        }

        if (
          !capturedStream ||
          typeof capturedStream.getAudioTracks !== "function"
        ) {
          throw new Error(
            "The browser did not return a valid microphone MediaStream."
          );
        }

        s.stream = capturedStream;
        s.track = capturedStream.getAudioTracks().find(
          track => track.readyState === "live"
        );

        if (!s.track) {
          throw new Error("The microphone stream has no live audio track.");
        }

        s.analyser = s.context.createAnalyser();

        // Higher resolution reveals more individual tones and bass detail.
        s.analyser.fftSize = 4096;

        // Responsive enough for transients without excessive flicker.
        s.analyser.smoothingTimeConstant = 0.72;

        // Float frequency data is mapped explicitly below, but keep these
        // meaningful for debugging or switching to byte data.
        s.analyser.minDecibels = -100;
        s.analyser.maxDecibels = -20;

        // Use the resolved MediaStream directly: this fixes the type error.
        s.source = s.context.createMediaStreamSource(capturedStream);
        s.source.connect(s.analyser);

        // Deliberately NO connection to audioContext.destination.

        s.frequencyData = new Float32Array(
          s.analyser.frequencyBinCount
        );
        s.timeData = new Float32Array(s.analyser.fftSize);
        s.frequencyData.fill(-Infinity);

        configureFrequencyBands(s);
        resetSignal();

        listen(s, s.track, "ended", () => {
          if (!isCurrent(s)) return;
          stopMic();
          showNotice("The microphone disconnected. Press Start Mic to reconnect.");
        });

        listen(s, s.track, "mute", () => {
          if (isCurrent(s)) updateAudioUI();
        });

        listen(s, s.track, "unmute", () => {
          if (!isCurrent(s)) return;
          s.silenceTime = 0;
          clearNextFrame = true;
          updateAudioUI();
        });

        listen(s, s.context, "statechange", () => {
          if (!isCurrent(s)) return;

          if (s.context.state === "closed") {
            stopMic();
            showNotice("The audio session closed. Press Start Mic to reconnect.");
          } else {
            updateAudioUI();
          }
        });

        s.ready = true;
        updateAudioUI();

        // Useful diagnostics without adding anything to the visual design.
        console.info("CHROMA microphone:", {
          device: s.track.label,
          settings: s.track.getSettings?.(),
          sampleRate: s.context.sampleRate,
          fftSize: s.analyser.fftSize
        });

        micButton.focus({ preventScroll: true });
      } catch (error) {
        // An older, cancelled request must not tear down a newer session.
        if (!isCurrent(s)) return;

        console.error("CHROMA microphone startup:", error);
        session = null;
        disposeSession(s);
        resetSignal();
        updateAudioUI();

        errorElement.textContent = friendlyAudioError(error);
        errorElement.hidden = false;
      }
    }

    function stopMic() {
      const oldSession = session;
      session = null;
      disposeSession(oldSession);
      resetSignal();
      updateAudioUI();
      wakeHUD();
    }

    startButton.addEventListener("click", startMic);

    micButton.addEventListener("click", async () => {
      const s = session;
      if (!s) return;

      if (!s.ready) {
        stopMic();
        startButton.focus({ preventScroll: true });
        return;
      }

      if (s.context.state !== "running") {
        try {
          await s.context.resume();
          if (isCurrent(s)) {
            clearNextFrame = true;
            updateAudioUI();
          }
        } catch (error) {
          if (isCurrent(s)) showNotice(friendlyAudioError(error));
        }
      } else {
        stopMic();
        startButton.focus({ preventScroll: true });
      }
    });

    // Release the microphone on navigation, including back/forward cache entry.
    window.addEventListener("pagehide", stopMic);

    // ============================================================
    // Signal processing
    // ============================================================

    function spectrumLevel(db) {
      if (!Number.isFinite(db)) return 0;

      // Visual dB mapping, not a calibrated sound-pressure measurement.
      // Peak-per-band analysis preserves narrow harmonics.
      const normalized = Math.max(0, Math.min(1, (db + 100) / 80));

      // A gentle lift makes quiet spectral detail easier to see.
      // True zero stays zero; no invented live frequency activity.
      return Math.min(1, Math.pow(normalized, 0.9) * sensitivity);
    }

      : 0;

    // Calm: slow orbit.
    // Stable fast beats: sustained faster rotation.
    // Isolated beats: a small, short-lived push.
    const targetSpeed = active
      ? 0.025
        + tempoFactor * rhythm.confidence * recentBeat * 0.95
        + rhythm.activity * 0.2
        + rhythm.pulse * 0.18
      : 0.025;

    const speedResponse = targetSpeed > rhythm.speed ? 2.8 : 1.1;

    rhythm.speed += (targetSpeed - rhythm.speed)
      * (1 - Math.exp(-dt * speedResponse));

    if (!reducedMotion.matches) {
      rhythm.angle = (rhythm.angle + rhythm.speed * dt) % TAU;
    }
  }

  // Hook the existing analysis without changing its audio handling.
  const originalReadAudio = readAudio;

  readAudio = function(time, dt) {
    originalReadAudio(time, dt);
    updateRhythm(time, dt);
  };

  const originalResetSignal = resetSignal;

  resetSignal = function() {
    originalResetSignal();
    resetRhythm();
  };

  // ============================================================
  // 2. Radial motion and beat ripples
  // ============================================================

  const originalDrawRadial = drawRadial;

  drawRadial = function(time) {
    // Original ring rotation uses time * 0.025.
    // Supply an equivalent time derived from integrated rhythm motion.
    const motionTime = reducedMotion.matches
      ? time
      : rhythm.angle / 0.025;

    originalDrawRadial(motionTime);

    if (reducedMotion.matches || !rhythm.ripples.length) return;

    const cx = width / 2;
    const cy = height * 0.44;
    const size = Math.min(width, height * 0.82);
    const baseRadius = size * 0.19;

    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    ctx.lineWidth = 1.2;

    for (const ripple of rhythm.ripples) {
      const progress = ripple.age / 1.6;
      const ease = 1 - Math.pow(1 - progress, 2);

      const radius = baseRadius
        + size * 0.22 * ease;

      const opacity = Math.pow(1 - progress, 2)
        * 0.28 * ripple.strength;

      ctx.globalAlpha = opacity;
      ctx.strokeStyle = ripple.color;
      ctx.shadowColor = ripple.color;
      ctx.shadowBlur = 12;

      ctx.beginPath();
      ctx.arc(cx, cy, radius, 0, TAU);
      ctx.stroke();
    }

    ctx.restore();
  };

  // ============================================================
  // 3. Optional HDR presentation canvas
  // ============================================================

  const hdrCanvas = document.createElement("canvas");
  hdrCanvas.id = "chroma-hdr";
  hdrCanvas.hidden = true;
  hdrCanvas.setAttribute("aria-hidden", "true");

  Object.assign(hdrCanvas.style, {
    position: "fixed",
    inset: "0",
    width: "100%",
    height: "100%",
    zIndex: "1",
    pointerEvents: "none",
    background: "#0a0a0f"
  });

  // Unsupported CSS properties are safely ignored.
  hdrCanvas.style.setProperty("dynamic-range-limit", "no-limit");
  document.body.appendChild(hdrCanvas);

  const hdrButton = document.createElement("button");
  hdrButton.type = "button";
  hdrButton.className = "utility";
  hdrButton.textContent = "HDR";
  hdrButton.setAttribute("aria-pressed", "false");
  hdrButton.title = "Enable HDR neon highlights on a compatible display";

  fullscreenButton.before(hdrButton);

  const hdrDisplay = matchMedia("(dynamic-range: high)");

  let gpu = null;
  let hdrStarting = false;
  let hdrGeneration = 0;

  function updateHDRButton() {
    hdrButton.disabled = hdrStarting;
    hdrButton.textContent = hdrStarting
      ? "HDR…"
      : gpu ? "HDR On" : "HDR";

    hdrButton.setAttribute("aria-pressed", String(!!gpu));
    hdrButton.style.color = gpu ? "var(--accent)" : "";
  }

  function destroyGPU(g) {
    if (!g) return;

    try { g.context?.unconfigure(); } catch {}
    try { g.texture?.destroy(); } catch {}
    try { g.uniform?.destroy(); } catch {}
    try { g.device?.destroy(); } catch {}
  }

function disableHDR() {
  hdrGeneration++;

  const old = gpu;
  gpu = null;
  hdrStarting = false;

  hdrCanvas.hidden = true;
  destroyGPU(old);

  // Restore the main application's original full-DPR canvas.
  resize();

  updateHDRButton();
  clearNextFrame = true;
}

const shaderCode = `
  struct Parameters {
    texel: vec2<f32>,
    intensity: f32,
    beat: f32,
  };

  @group(0) @binding(0)
  var scene: texture_2d<f32>;

  @group(0) @binding(1)
  var sceneSampler: sampler;

  @group(0) @binding(2)
  var<uniform> params: Parameters;

  struct VertexOutput {
    @builtin(position) position: vec4<f32>,
    @location(0) uv: vec2<f32>,
  };

  @vertex
  fn vertexMain(
    @builtin(vertex_index) index: u32
  ) -> VertexOutput {
    var positions = array<vec2<f32>, 3>(
      vec2<f32>(-1.0, -1.0),
      vec2<f32>( 3.0, -1.0),
      vec2<f32>(-1.0,  3.0)
    );

    let p = positions[index];

    var output: VertexOutput;
    output.position = vec4<f32>(p, 0.0, 1.0);
    output.uv = vec2<f32>(
      p.x * 0.5 + 0.5,
      0.5 - p.y * 0.5
    );

    return output;
  }

  fn toLinear(c: vec3<f32>) -> vec3<f32> {
    return select(
      pow((c + vec3<f32>(0.055)) / 1.055, vec3<f32>(2.4)),
      c / 12.92,
      c <= vec3<f32>(0.04045)
    );
  }

  fn toEncoded(c: vec3<f32>) -> vec3<f32> {
    let safe = max(c, vec3<f32>(0.0));

    return select(
      1.055 * pow(safe, vec3<f32>(1.0 / 2.4)) - 0.055,
      safe * 12.92,
      safe <= vec3<f32>(0.0031308)
    );
  }

  @fragment
  fn fragmentMain(input: VertexOutput) -> @location(0) vec4<f32> {
    // One texture lookup. Reuse the glow already drawn by Canvas 2D.
    let encoded = textureSample(scene, sceneSampler, input.uv).rgb;
    let base = toLinear(encoded);

    let peak = max(max(base.r, base.g), base.b);
    let highlight = smoothstep(0.35, 0.95, peak);

    let luma = dot(base, vec3<f32>(0.229, 0.692, 0.079));

    let colorful = max(
      mix(vec3<f32>(luma), base, 1.0 + highlight * 0.10),
      vec3<f32>(0.0)
    );

    let gain = 1.0
      + highlight * (params.intensity + params.beat * 0.22);

    // Preserve values above SDR white for the extended HDR canvas.
    return vec4<f32>(toEncoded(colorful * gain), 1.0);
  }
`;

  async function enableHDR() {
    if (gpu || hdrStarting) return;

    if (!navigator.gpu) {
      showNotice(
        "This browser does not expose WebGPU. Beat effects still work. Try an up-to-date Chrome on your Mac."
      );
      return;
    }

    if (!hdrDisplay.matches) {
      showNotice(
        "The browser is not reporting an HDR-capable display. The visualizer will stay in SDR."
      );
      return;
    }

    hdrStarting = true;
    updateHDRButton();

    const generation = ++hdrGeneration;

    const g = {
      device: null,
      context: null,
      pipeline: null,
      sampler: null,
      uniform: null,
      texture: null,
      bindGroup: null,

      sourceWidth: 0,
      sourceHeight: 0,

      busy: false,
      parameters: new Float32Array(4)
    };

    try {
      const adapter = await navigator.gpu.requestAdapter({
        powerPreference: "high-performance"
      });

      if (!adapter) {
        throw new Error("No suitable WebGPU adapter was found.");
      }

      if (generation !== hdrGeneration) return;

      g.device = await adapter.requestDevice();

      if (generation !== hdrGeneration) {
        destroyGPU(g);
        return;
      }

      g.context = hdrCanvas.getContext("webgpu");

      if (!g.context) {
        throw new Error("The browser could not create a WebGPU canvas.");
      }

      // Capture validation errors rather than silently showing a black canvas.
      g.device.pushErrorScope("validation");

      g.context.configure({
        device: g.device,
        format: "rgba16float",
        colorSpace: "display-p3",
        alphaMode: "opaque",
        toneMapping: { mode: "extended" }
      });

      const configurationError = await g.device.popErrorScope();

      if (configurationError) {
        throw new Error(configurationError.message);
      }

      if (generation !== hdrGeneration) {
        destroyGPU(g);
        return;
      }

      // Merely accepting an unknown option is not proof of HDR support.
      const configuration = g.context.getConfiguration?.();

      if (
        configuration?.format !== "rgba16float" ||
        configuration?.toneMapping?.mode !== "extended"
      ) {
        throw new Error(
          "This browser does not confirm support for extended HDR canvas output."
        );
      }

      g.sampler = g.device.createSampler({
        magFilter: "linear",
        minFilter: "linear",
        addressModeU: "clamp-to-edge",
        addressModeV: "clamp-to-edge"
      });

      g.uniform = g.device.createBuffer({
        size: 16,
        usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST
      });

      const module = g.device.createShaderModule({
        label: "CHROMA HDR shader",
        code: shaderCode
      });

      g.pipeline = await g.device.createRenderPipelineAsync({
        label: "CHROMA HDR presentation",
        layout: "auto",
        vertex: {
          module,
          entryPoint: "vertexMain"
        },
        fragment: {
          module,
          entryPoint: "fragmentMain",
          targets: [{ format: "rgba16float" }]
        },
        primitive: {
          topology: "triangle-list"
        }
      });

      if (generation !== hdrGeneration) {
        destroyGPU(g);
        return;
      }

      g.device.addEventListener("uncapturederror", event => {
        if (gpu !== g) return;

        console.error("CHROMA HDR:", event.error);
        disableHDR();
        showNotice("HDR rendering stopped. The normal visualizer is still running.");
      });

      g.device.lost.then(info => {
        if (gpu !== g) return;

        console.warn("CHROMA GPU device lost:", info.message);
        disableHDR();
        showNotice("The GPU session ended. Switched back to SDR.");
      });

      gpu = g;
      hdrStarting = false;
      updateHDRButton();

      showNotice(
        "HDR enabled. Neon highlights use extended brightness; the controls remain SDR. Tap HDR On to compare."
      );

      // The overlay remains hidden until its first submitted frame.
    } catch (error) {
      destroyGPU(g);

      if (generation !== hdrGeneration) return;

      gpu = null;
      hdrStarting = false;
      hdrCanvas.hidden = true;
      updateHDRButton();

      console.warn("CHROMA HDR unavailable:", error);
      showNotice(error.message + " The visualizer will stay in SDR.");
    }
  }

// Balanced default for animated neon: about one million source pixels.
// Try 750000 for more speed, or 1600000 for more detail.
const HDR_PIXEL_BUDGET = 750000;

function prepareGPUSize(g) {
  const limit = g.device.limits.maxTextureDimension2D;

  const renderScale = Math.min(
    window.devicePixelRatio || 1,
    1.25,
    Math.sqrt(HDR_PIXEL_BUDGET / (width * height)),
    limit / width,
    limit / height
  );

  const sourceWidth = Math.max(
    1, Math.floor(width * renderScale)
  );

  const sourceHeight = Math.max(
    1, Math.floor(height * renderScale)
  );

  // Resize the actual Canvas 2D source, not only the HDR overlay.
  // Keep drawing coordinates in CSS pixels.
  if (
    canvas.width !== sourceWidth ||
    canvas.height !== sourceHeight
  ) {
    canvas.width = sourceWidth;
    canvas.height = sourceHeight;

    ctx.setTransform(
      sourceWidth / width, 0,
      0, sourceHeight / height,
      0, 0
    );

    // Leave the main app's `dpr` variable unchanged. It tracks the
    // physical display DPR and is also used to detect monitor changes.
    invalidateGradients();
    clearNextFrame = true;

    // Resizing clears the source. Draw it again before presenting it.
    return false;
  }

  if (
    hdrCanvas.width !== sourceWidth ||
    hdrCanvas.height !== sourceHeight
  ) {
    hdrCanvas.width = sourceWidth;
    hdrCanvas.height = sourceHeight;
  }

  if (
    g.sourceWidth === sourceWidth &&
    g.sourceHeight === sourceHeight &&
    g.texture
  ) {
    return true;
  }

  g.texture?.destroy();

  g.sourceWidth = sourceWidth;
  g.sourceHeight = sourceHeight;

  g.texture = g.device.createTexture({
    label: "CHROMA optimized HDR source",
    size: [sourceWidth, sourceHeight],
    format: "rgba8unorm",
    usage:
      GPUTextureUsage.TEXTURE_BINDING |
      GPUTextureUsage.COPY_DST |
      GPUTextureUsage.RENDER_ATTACHMENT
  });

  g.bindGroup = g.device.createBindGroup({
    layout: g.pipeline.getBindGroupLayout(0),
    entries: [
      {
        binding: 0,
        resource: g.texture.createView()
      },
      {
        binding: 1,
        resource: g.sampler
      },
      {
        binding: 2,
        resource: { buffer: g.uniform }
      }
    ]
  });

  return true;
}

function presentHDR() {
  const g = gpu;

  if (!g || document.hidden) return;

  try {
    // A resized source needs one fresh draw before it is copied.
    if (!prepareGPUSize(g)) return;

    g.device.queue.copyExternalImageToTexture(
      { source: canvas },
      {
        texture: g.texture,
        colorSpace: "display-p3",
        premultipliedAlpha: false
      },
      [g.sourceWidth, g.sourceHeight]
    );

    g.parameters[0] = 1 / g.sourceWidth;
    g.parameters[1] = 1 / g.sourceHeight;

    // Same HDR highlight intensity as the previous version.
    g.parameters[2] = 2.0;
    g.parameters[3] = reducedMotion.matches ? 0 : rhythm.pulse;

    g.device.queue.writeBuffer(
      g.uniform,
      0,
      g.parameters
    );

    const encoder = g.device.createCommandEncoder();

    const pass = encoder.beginRenderPass({
      colorAttachments: [{
        view: g.context.getCurrentTexture().createView(),
        loadOp: "clear",
        storeOp: "store",
        clearValue: { r: 0, g: 0, b: 0, a: 1 }
      }]
    });

    pass.setPipeline(g.pipeline);
    pass.setBindGroup(0, g.bindGroup);
    pass.draw(3);
    pass.end();

    // Submit without serializing every frame behind a completion Promise.
    g.device.queue.submit([encoder.finish()]);

    hdrCanvas.hidden = false;
  } catch (error) {
    console.warn("CHROMA HDR presentation:", error);
    disableHDR();

    showNotice(
      "HDR could not continue. The normal visualizer is still running."
    );
  }
}

  hdrButton.addEventListener("click", () => {
    wakeHUD();

    if (gpu) {
      disableHDR();
    } else {
      enableHDR();
    }
  });

  hdrDisplay.addEventListener("change", () => {
    if (!hdrDisplay.matches && (gpu || hdrStarting)) {
      disableHDR();
      showNotice("HDR is no longer available on this display. Switched to SDR.");
    }
  });

  window.addEventListener("pagehide", disableHDR);

  // ============================================================
  // 4. Present HDR after the original scene has finished drawing
  // ============================================================

  const originalRender = render;

  render = function(timestamp) {
    originalRender(timestamp);

    if (!document.hidden) {
      presentHDR();
    }
  };

  /*
   * The original animation callback may already be scheduled when this
   * script runs. Cancel it once and restart using the enhanced renderer.
   */
  cancelAnimationFrame(animationId);
  animationId = 0;
  startAnimation();
})();
</script>
</body>
</html>
